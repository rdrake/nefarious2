name: irctest

# Protocol conformance: runs the irctest suite (evilnet/irctest, pinned by
# the .irctest submodule) against a fresh build, using the controller in
# tools/irctest/nefarious.py.

on:
  pull_request:
  push:
    branches:
      - master
      - ircv3.2-upgrade
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irctest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  irctest:
    name: irctest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf automake libtool byacc flex pkg-config faketime \
            libssl-dev libzstd-dev librocksdb-dev libcurl4-openssl-dev \
            libjansson-dev libmaxminddb-dev libgeoip-dev libgit2-dev

      # The committed configure can lag configure.in (the Dockerfile
      # regenerates it too).
      - name: Configure
        run: |
          autoreconf -fi
          ./configure --prefix="$HOME/ircd" --enable-debug --with-maxcon=4096 \
            --with-rocksdb=/usr --with-zstd=/usr --enable-keycloak

      - name: Build
        run: |
          make -j"$(nproc)"
          make install

      # The submodule URL is SSH, which a runner cannot fetch; check out the
      # same commit over HTTPS instead.
      - name: Find the pinned irctest commit
        id: pin
        run: echo "sha=$(git ls-tree HEAD .irctest | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: evilnet/irctest
          ref: ${{ steps.pin.outputs.sha }}
          path: .irctest

      # tools/irctest/nefarious.py is the controller of record; the copy in
      # the irctest tree is older.
      - name: Install the Nefarious controller
        run: cp tools/irctest/nefarious.py .irctest/irctest/controllers/nefarious.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install irctest
        working-directory: .irctest
        run: pip install -r requirements.txt pytest-xdist pytest-timeout

      - name: Run irctest
        working-directory: .irctest
        run: |
          PATH="$HOME/ircd/bin:$PATH" \
            make nefarious PYTEST_ARGS="--junit-xml=pytest.xml --timeout=300 -rfE"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irctest-results
          path: .irctest/pytest.xml
          if-no-files-found: ignore
